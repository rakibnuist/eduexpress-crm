# EduExpress CRM — Hostinger VPS deploy (Docker + existing Traefik)
# Traefik on this VPS runs in host-network mode with the "letsencrypt"
# HTTP-01 cert resolver and Docker label discovery (exposedbydefault=false).
# These labels register crm.eduexpressint.com and auto-provision SSL.
#
# Deploy:  docker compose up -d --build
services:
  crm:
    build:
      context: .
    image: eduexpress-crm:latest
    container_name: eduexpress-crm
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_PATH: /data/crm.db
      RESET_KEY: ${RESET_KEY:?RESET_KEY must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set}
      WEBSITE_WEBHOOK_SECRET: ${WEBSITE_WEBHOOK_SECRET:?WEBSITE_WEBHOOK_SECRET must be set}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      RUN_DATA_BACKFILLS: ${RUN_DATA_BACKFILLS:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      N8N_PUBLISH_WEBHOOK: ${N8N_PUBLISH_WEBHOOK:-}
      N8N_WELCOME_WEBHOOK: ${N8N_WELCOME_WEBHOOK:-}
    volumes:
      - crm-data:/data                # SQLite DB + WhatsApp linked-device session (wa_auth)
      - crm-uploads:/app/uploads      # uploaded documents
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.crm.rule=Host(`crm.eduexpressint.com`)"
      - "traefik.http.routers.crm.entrypoints=websecure"
      - "traefik.http.routers.crm.tls=true"
      - "traefik.http.routers.crm.tls.certresolver=letsencrypt"
      - "traefik.http.services.crm.loadbalancer.server.port=3000"
      # www.crm → crm (optional redirect target already handled by DNS CNAME)

volumes:
  crm-data:
    name: eduexpress-crm_crm-data
  crm-uploads:
    name: eduexpress-crm_crm-uploads
